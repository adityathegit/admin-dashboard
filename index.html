<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="grid-container">
        <div class="sidebar">

            <div class="title">
                <ul>
                    <li>
                        <img class="logo-icon" src="assets/icons/view-dashboard.svg" alt="dashboard">
                        <span>Dashboard</span>
                    </li>
                </ul>
            </div>

            <div class="navigation">
                <ul>
                    <li>
                        <img class="nav-icon" src="assets/icons/home.svg" alt="home">
                        <span>Home</span>
                    </li>
                    <li>
                        <img class="nav-icon" src="assets/icons/profile.svg" alt="profile">
                        <span>Profile</span>
                    </li>
                    <li>
                        <img class="nav-icon" src="assets/icons/message.svg" alt="messages">
                        <span>Messages</span>
                    </li>
                    <li>
                        <img class="nav-icon" src="assets/icons/history.svg" alt="history">
                        <span>History</span>
                    </li>
                    <li>
                        <img class="nav-icon" src="assets/icons/tasks.svg" alt="tasks">
                        <span>Tasks</span>
                    </li>
                    <li>
                        <img class="nav-icon" src="assets/icons/community.svg" alt="communities">
                        <span>Communities</span>
                    </li>
                </ul>
            </div>

            <div class="navigation">
                <ul>
                    <li>
                        <img class="nav-icon" src="assets/icons/settings.svg" alt="settings">
                        <span>Settings</span>
                    </li>
                    <li>
                        <img class="nav-icon" src="assets/icons/support.svg" alt="support">
                        <span>Support</span>
                    </li>
                    <li>
                        <img class="nav-icon" src="assets/icons/privacy.svg" alt="privacy">
                        <span>Privacy</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="header">
            <div class="child-header">
                <div class="box-1">
                    <div class="search">
                        <img src="assets/icons/search.svg" alt="search" width="20px">
                        <input type="search">
                    </div>

                    <div class="notification">
                        <img src="assets/icons/notification.svg" alt="notification" width="20px">
                        <div class="profile-icon">
                            <img src="assets/profile/profile-picture.png" alt="profile-picture">
                        </div>
                        <p>Ramlal Tiwari</p>
                    </div>
                </div>

                <div class="box-2">
                    <div class="profile">
                        <div class="profile-image">
                            <img src="assets/profile/profile-picture.png" alt="profile-picture">
                        </div>
                        <div class="profile-text">
                            <span class="hi">Hi there,</span>
                            <span class="username">Ramlal Tiwari (@ramlal)</span>
                        </div>
                    </div>

                    <div class="profile-buttons">
                        <button>New</button>
                        <button>Upload</button>
                        <button>Share</button>
                    </div>

                </div>
            </div>
        </div>

        <div class="main-content">Main-content</div>
    </div>
</body>

</html>
