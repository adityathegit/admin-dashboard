<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <div class="sidebar">

            <div class="title">
                <ul>
                    <li>
                        <img class="logo-icon" src="assets/icons/view-dashboard.svg" alt="dashboard">
                        <span>Dashboard</span>
                    </li>
                </ul>
            </div>

            <div class="navigation">
                <ul>
                    <li>
                        <img class="icon" src="assets/icons/home.svg" alt="home">
                        <span>Home</span>
                    </li>
                    <li>
                        <img class="icon" src="assets/icons/profile.svg" alt="profile">
                        <span>Profile</span>
                    </li>
                    <li>
                        <img class="icon" src="assets/icons/message.svg" alt="messages">
                        <span>Messages</span>
                    </li>
                    <li>
                        <img class="icon" src="assets/icons/history.svg" alt="history">
                        <span>History</span>
                    </li>
                    <li>
                        <img class="icon" src="assets/icons/tasks.svg" alt="tasks">
                        <span>Tasks</span>
                    </li>
                    <li>
                        <img class="icon" src="assets/icons/community.svg" alt="communities">
                        <span>Communities</span>
                    </li>
                </ul>
            </div>

            <div class="navigation">
                <ul>
                    <li>
                        <img class="icon" src="assets/icons/settings.svg" alt="settings">
                        <span>Settings</span>
                    </li>
                    <li>
                        <img class="icon" src="assets/icons/support.svg" alt="support">
                        <span>Support</span>
                    </li>
                    <li>
                        <img class="icon" src="assets/icons/privacy.svg" alt="privacy">
                        <span>Privacy</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="header">Header</div>
        <div class="main-content">Main-content</div>
    </div>
</body>
</html>
